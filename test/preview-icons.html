<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dsh-message-toolbar icons</title>
<style>
  body { margin: 0; padding: 18px 22px; background: #fff; color: #6b7280;
         font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 13px; font-weight: 600; color: #374151; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .act { background: none; border: 0; padding: 3px; border-radius: 6px; color: #6b7280;
         display: inline-flex; align-items: center; justify-content: center; }
  .act.on { color: #2563eb; background: rgba(37,99,235,.08); }
  .hint { font-size: 11px; color: #9ca3af; }
  .big svg { width: 96px; height: 96px; }
  .mid svg { width: 36px; height: 36px; }
  .zoom { color: #111827; }
  .label { font-size: 11px; color: #9ca3af; }
  .group { margin-bottom: 22px; }
</style>
</head>
<body>
<h1>dsh-message-toolbar · toolbar icons (actual 18px, then 2x and 5.3x for inspection)</h1>

<div class="group">
  <div class="row">
    <button class="act" title="copy">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
        <rect x="5.2" y="5.2" width="8.2" height="8.2" rx="2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M10.6 5.2V4.2a1.8 1.8 0 00-1.8-1.8H4.2a1.8 1.8 0 00-1.8 1.8v4.6a1.8 1.8 0 001.8 1.8h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="act" title="edit">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
        <path d="M11.1 2.4a1.9 1.9 0 012.7 2.7L5.3 13.6l-3.4.7.7-3.4L11.1 2.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="act" title="regenerate">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
        <path d="M13.2 8a5.2 5.2 0 11-1.6-3.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M13.4 2.3v3.1h-3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="act on" title="translate">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M2.6 7.2h7.8M6.5 4.4v2.8M3.2 10.1c1.4 3.6 3.5 6.1 6.3 7.9M9.8 10.1c-1.4 3.4-3.7 6.3-6.5 8.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.4 4.6L12.9 19.4h9L17.4 4.6M14.5 14.6h5.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="act" title="switch model">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
        <rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.3"/>
        <path d="M6.4 2.2v2.2M9.6 2.2v2.2M6.4 11.6v2.2M9.6 11.6v2.2M2.2 6.4h2.2M2.2 9.6h2.2M11.6 6.4h2.2M11.6 9.6h2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="act" title="delete">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
        <path d="M2.9 4.4h10.2M6.2 4.4V3a1 1 0 011-1h1.6a1 1 0 011 1v1.4M4 4.4l.6 9a1.2 1.2 0 001.2 1.1h4.4a1.2 1.2 0 001.2-1.1l.6-9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="label">actual size (18px)</span>
  </div>
</div>

<div class="group mid">
  <div class="row zoom">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
      <path d="M2.6 7.2h7.8M6.5 4.4v2.8M3.2 10.1c1.4 3.6 3.5 6.1 6.3 7.9M9.8 10.1c-1.4 3.4-3.7 6.3-6.5 8.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17.4 4.6L12.9 19.4h9L17.4 4.6M14.5 14.6h5.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg width="36" height="36" viewBox="0 0 16 16" fill="none">
      <path d="M11.1 2.4a1.9 1.9 0 012.7 2.7L5.3 13.6l-3.4.7.7-3.4L11.1 2.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
    <span class="label">2x</span>
  </div>
</div>

<div class="group big">
  <div class="row zoom">
    <svg width="96" height="96" viewBox="0 0 24 24" fill="none">
      <path d="M2.6 7.2h7.8M6.5 4.4v2.8M3.2 10.1c1.4 3.6 3.5 6.1 6.3 7.9M9.8 10.1c-1.4 3.4-3.7 6.3-6.5 8.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17.4 4.6L12.9 19.4h9L17.4 4.6M14.5 14.6h5.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="label">translate glyph, 5.3x</span>
  </div>
</div>
</body>
</html>
