<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dsh-message-toolbar · action row preview</title>
<style>
  /* Values copied from DSH's own MessageIconActions.module.css, so this page
     shows exactly what the toolbar looks like inside a message action row. */
  :root { --dsw-radius-sm: 6px; --dsw-alias-label-tertiary: #9ca3af; --dsw-alias-label-secondary: #6b7280;
          --dsw-alias-interactive-bg-hover: rgba(0,0,0,.06); --dsh-content-font-delta: 0px; }
  body { margin: 0; padding: 26px 30px; background: #fff; color: var(--dsw-alias-label-tertiary);
         font: 15px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 12px; font-weight: 600; color: #374151; margin: 0 0 18px; letter-spacing: .02em; }
  .actions { display: flex; align-items: center; gap: 8px; height: 28px; }
  .action { width: 28px; height: 28px; border-radius: var(--dsw-radius-sm); color: var(--dsw-alias-label-tertiary);
            background: 0 0; border: 0; padding: 6px; display: inline-flex;
            align-items: center; justify-content: center; cursor: pointer; }
  .action svg { width: 17px; height: 17px; }
  .action:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-secondary); }
  .time { font-size: 12px; line-height: 24px; margin-left: 8px; }
  .caption { font-size: 11px; color: #9ca3af; margin: 4px 0 26px; }
  .zoom { zoom: 3; }
  .strip { margin-bottom: 8px; }
</style>
</head>
<body>
<h1>native row + toolbar icons (17px glyphs, 28px boxes, 8px gap)</h1>

<div class="strip actions">
  <button class="action" title="copy">
    <svg viewBox="0 0 16 16" fill="none"><rect x="5.2" y="5.2" width="8.2" height="8.2" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M10.6 5.2V4.2a1.8 1.8 0 00-1.8-1.8H4.2a1.8 1.8 0 00-1.8 1.8v4.6a1.8 1.8 0 001.8 1.8h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
  <button class="action" title="regenerate (native)">
    <svg viewBox="0 0 16 16" fill="none"><path d="M13.2 8a5.2 5.2 0 11-1.6-3.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.4 2.3v3.1h-3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="action" title="switch model">
    <svg viewBox="0 0 16 16" fill="none"><rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M6.4 2.2v2.2M9.6 2.2v2.2M6.4 11.6v2.2M9.6 11.6v2.2M2.2 6.4h2.2M2.2 9.6h2.2M11.6 6.4h2.2M11.6 9.6h2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
  <button class="action" title="translate">
    <svg viewBox="0 0 16 16" fill="none"><path d="M2 4.6h7M5.6 2.3v2.3M2.9 6.9c.9 2.4 2.4 4.4 4.4 6.1M8.2 6.9c-1 2.6-2.8 4.9-5.6 6.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6 2.8L10.4 14h4.6L12.6 2.8M11 10.7h3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="action" title="delete">
    <svg viewBox="0 0 16 16" fill="none"><path d="M2.9 4.4h10.2M6.2 4.4V3a1 1 0 011-1h1.6a1 1 0 011 1v1.4M4 4.4l.6 9a1.2 1.2 0 001.2 1.1h4.4a1.2 1.2 0 001.2-1.1l.6-9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="time">14:35</span>
</div>
<div class="caption">actual size · 1 · 2 native glyphs (copy, regenerate) then toolbar glyphs (model, translate, delete)</div>

<div class="zoom">
  <div class="strip actions">
    <button class="action" title="copy">
      <svg viewBox="0 0 16 16" fill="none"><rect x="5.2" y="5.2" width="8.2" height="8.2" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M10.6 5.2V4.2a1.8 1.8 0 00-1.8-1.8H4.2a1.8 1.8 0 00-1.8 1.8v4.6a1.8 1.8 0 001.8 1.8h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button class="action" title="regenerate (native)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M13.2 8a5.2 5.2 0 11-1.6-3.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.4 2.3v3.1h-3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="action" title="switch model">
      <svg viewBox="0 0 16 16" fill="none"><rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M6.4 2.2v2.2M9.6 2.2v2.2M6.4 11.6v2.2M9.6 11.6v2.2M2.2 6.4h2.2M2.2 9.6h2.2M11.6 6.4h2.2M11.6 9.6h2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button class="action" title="translate">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 4.6h7M5.6 2.3v2.3M2.9 6.9c.9 2.4 2.4 4.4 4.4 6.1M8.2 6.9c-1 2.6-2.8 4.9-5.6 6.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6 2.8L10.4 14h4.6L12.6 2.8M11 10.7h3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="action" title="delete">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2.9 4.4h10.2M6.2 4.4V3a1 1 0 011-1h1.6a1 1 0 011 1v1.4M4 4.4l.6 9a1.2 1.2 0 001.2 1.1h4.4a1.2 1.2 0 001.2-1.1l.6-9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="action" title="pencil">
      <svg viewBox="0 0 16 16" fill="none"><path d="M11.1 2.4a1.9 1.9 0 012.7 2.7L5.3 13.6l-3.4.7.7-3.4L11.1 2.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<div class="caption">3x zoom · same metrics, so the toolbar glyphs must not look heavier or larger than the native two</div>
</body>
</html>
